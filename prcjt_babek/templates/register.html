<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/css/style.css">
    <title>Регистрация - MySite</title>
</head>
<body>
    <header>
        <div class="logo">My<span>Site</span></div>
        <nav><a href="/">Главная</a></nav>
    </header>
    <main class="hero">
        <div style="max-width: 400px; margin: 0 auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
            <h2>Создать профиль</h2>
            {{if .Error}}<p style="color: red;">{{.Error}}</p>{{end}}
            <form action="/register" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="text" name="name" placeholder="Имя" required style="padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                <input type="text" name="login" placeholder="Логин" required style="padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                <input type="email" name="email" placeholder="Email" required style="padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                <input type="password" name="password" placeholder="Пароль" required style="padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                <input type="date" name="birth" placeholder="Дата рождения" required style="padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                <button type="submit" class="btn-contact" style="border: none; cursor: pointer; background: #28a745;">Зарегистрироваться</button>
            </form>
            <p style="margin-top: 20px;"><a href="/login" style="color: #666; text-decoration: none;">Уже есть аккаунт? Войти</a></p>
        </div>
    </main>
</body>
</html>
